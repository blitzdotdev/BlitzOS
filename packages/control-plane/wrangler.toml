name = "blitz-control-plane"
main = "src/worker.ts"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "blitz-control-plane"
database_id = "replace-with-d1-database-id"
migrations_dir = "migrations"

[observability]
enabled = true

[triggers]
crons = ["0 * * * *", "0 3 * * *"]
