name = "blitz-control-plane"
main = "src/worker.ts"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "https://blitz-control-plane.blitzapp.workers.dev"
BOX_IMAGE_REF = "https://blitz-control-plane.blitzapp.workers.dev/box-image/manifest.json"
BOX_IMAGE_TAG = "blitz-box:20260814-amd64"
BOX_IMAGE_SHA256 = "db41bc6bb5d76963c1dcde41d434c1aecc12b92869300a358044543d7f1668f1"
SESSION_TTL_DAYS = "30"
MAX_CONCURRENT_WORKSPACES = "10"
MICROVM_HOSTS = '[{"name":"lab","url":"https://higher-diet-hitting-ipod.trycloudflare.com","tokenVar":"MICROVM_LAB_TOKEN"}]'

[[r2_buckets]]
binding = "BOX_IMAGES"
bucket_name = "blitz-box-images"

[[d1_databases]]
binding = "DB"
database_name = "blitz-control-plane"
database_id = "51bebbfa-dc55-4f64-bbbe-e71c02a9c899"
migrations_dir = "migrations"

[observability]
enabled = true

[assets]
directory = "../ui/dist"
not_found_handling = "single-page-application"
run_worker_first = [
  "/sessions*",
  "/workspaces*",
  "/integrations*",
  "/leases*",
  "/requests*",
  "/proxy*",
  "/volumes*",
  "/machine-types*",
  "/oauth/*",
  "/boxes/*",
  "/box-image*",
  "/api/*"
]

[triggers]
crons = ["0 * * * *", "0 3 * * *"]
