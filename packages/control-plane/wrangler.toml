name = "blitz-control-plane"
main = "src/worker.ts"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "https://blitz-control-plane.blitzapp.workers.dev"
BOX_IMAGE_REF = "https://blitz-control-plane.blitzapp.workers.dev/box-image/manifest.json"
BOX_IMAGE_TAG = "blitz-box:20260816b-amd64"
BOX_IMAGE_SHA256 = "994e746a202a703803743a0e4a3a2523b8f6c127dfe4eff09ceaf0695e7e71af"
SESSION_TTL_DAYS = "30"
MAX_CONCURRENT_WORKSPACES = "10"
MICROVM_HOSTS = '[{"name":"lab","tokenVar":"MICROVM_LAB_TOKEN","dynamic":true}]'
CLOUDFLARE_ACCOUNT_ID = "d25a778b256fb6ef6eea554d77c40f27"
CLOUDFLARE_ZONE_ID = "52fcb3a8adc81b791ea918d3bde25a39"
WORKSPACE_TUNNEL_ZONE = "blitzos.app"

[[r2_buckets]]
binding = "BOX_IMAGES"
bucket_name = "blitz-box-images"

[[d1_databases]]
binding = "DB"
database_name = "blitz-control-plane"
database_id = "51bebbfa-dc55-4f64-bbbe-e71c02a9c899"
migrations_dir = "migrations"

[observability]
enabled = true

[assets]
directory = "../webapp/dist"
not_found_handling = "single-page-application"
run_worker_first = [
  "/sessions*",
  "/workspaces*",
  "/integrations*",
  "/leases*",
  "/requests*",
  "/proxy*",
  "/volumes*",
  "/machine-types*",
  "/hosts*",
  "/oauth/*",
  "/boxes/*",
  "/box-image*",
  "/api/*"
]

[triggers]
crons = ["0 * * * *", "0 3 * * *"]
