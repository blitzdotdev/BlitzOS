name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:gate
      - run: npm test
        # The CORE_MANIFEST <-> API_PREFIXES drift gate and the other
        # managed-toolchain suites need no secrets, only this opt-in. Without
        # it six suites skip and the drift they guard ships unnoticed.
        env:
          BLITZDEV_MANAGED: "1"

  broker:
    name: Go broker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: packages/broker/go.mod
          cache-dependency-path: packages/broker/go.mod
      - run: go test ./...
        working-directory: packages/broker

  box-image:
    name: Box image build check (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build --platform linux/amd64 -f packages/box/Dockerfile .
