name: Deploy canary

# Canary is one shared Worker, and the last deploy wins. Deploying it by hand
# from a laptop means a branch can land there silently, and the next person
# debugs a build that matches no commit. That happened. This workflow makes
# "canary always equals main" a property of the machine rather than of
# somebody's discipline.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two canary deploys race. Queue instead of cancelling: a cancelled
# deploy can leave migrations applied with the old Worker still serving.
concurrency:
  group: canary-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy canary from main
    runs-on: ubuntu-latest
    environment: canary
    # The push trigger is already main-only, but workflow_dispatch lets a person
    # pick any ref in the Actions UI. Without this, the one failure mode this
    # workflow exists to remove — a branch deployed to the shared canary Worker —
    # is still reachable by hand.
    if: github.ref == 'refs/heads/main'
    steps:
      # A fork, or this repository before the secrets exist, skips with a
      # notice instead of failing. Same shape as release.yml's gate.
      - name: Check for deploy configuration
        id: gate
        env:
          CANARY_WRANGLER_TOML: ${{ secrets.CANARY_WRANGLER_TOML }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CANARY_WRANGLER_TOML" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Canary deploy skipped: set the CANARY_WRANGLER_TOML and CLOUDFLARE_API_TOKEN secrets on the 'canary' environment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Full history: the box-image advisory below diffs against the commit the
      # running canary reports, which a depth-1 checkout cannot reach.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.configured == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.configured == 'true'

      # wrangler's config patcher rejects a TOML that holds comments, so this
      # secret must be comment-free — the deploy writes to it on every run.
      # It does not have to be up to date: the deploy fills in any key
      # wrangler.toml.example has gained, and generates assets.run_worker_first
      # from core's route registrations. Only account-specific identifiers
      # (account_id, database_id, zone ids, APP_URL) have to be set here.
      - name: Write the canary wrangler.toml
        if: steps.gate.outputs.configured == 'true'
        env:
          CANARY_WRANGLER_TOML: ${{ secrets.CANARY_WRANGLER_TOML }}
        run: printf '%s\n' "$CANARY_WRANGLER_TOML" > packages/control-plane/wrangler.toml

      - name: Read the deployment origin
        id: origin
        if: steps.gate.outputs.configured == 'true'
        run: |
          url="$(node -e 'const fs=require("node:fs");import("smol-toml").then(({parse})=>{const v=parse(fs.readFileSync("packages/control-plane/wrangler.toml","utf8")).vars||{};process.stdout.write(v.APP_URL||"")})')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Advisory, never a gate. Box and broker changes ride the image and reach
      # new workspaces only, and images are built by hand for canary. Say so
      # loudly rather than deploy a worker-only half of a change in silence.
      - name: Report whether the box image is now stale
        if: steps.gate.outputs.configured == 'true'
        run: |
          if [ -z "${{ steps.origin.outputs.url }}" ]; then
            echo "::warning::The canary config sets no APP_URL, so the box image cannot be checked from here."
            exit 0
          fi
          set +e
          output="$(node packages/control-plane/scripts/check-box-image.mjs --url "${{ steps.origin.outputs.url }}" 2>&1)"
          code=$?
          echo "$output"
          if [ "$code" = "2" ]; then
            echo "::warning::The box image is now behind this commit. Deploying the Worker alone leaves those changes in no workspace. Build and pin a new canary image."
          fi
          exit 0

      - name: Deploy
        if: steps.gate.outputs.configured == 'true'
        # Both hosted deployments require every org to bring its own cloud
        # credential. A self-hoster runs `npm run deploy` without this and
        # keeps the example default, deployment-fallback.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BLITZ_DEPLOY_VAR_CLOUD_WORKSPACE_CREDENTIAL_POLICY: byok-required
          # The golden Hetzner snapshot this deployment boots. It removes the
          # apt install, the box-image download and the sshd move from first
          # boot: 130.6 s to 45.3 s, measured 2026-08-27.
          #
          # `*` is every location, not a shortcut. A Hetzner snapshot carries an
          # architecture and no location at all, so one x86 image boots every
          # x86 type in the project. Measured 2026-08-28: cx23@hel1 reaches its
          # relocated sshd in 41.3 s and cpx21@hil in 40.1 s, from this image.
          # An arm type would not match and would fall back to stock Ubuntu with
          # a warning; the catalog offers none today.
          #
          # It is hardcoded here rather than kept in a secret because it is not
          # one: it is a plain [vars] entry, and this is where the other
          # per-deployment non-secret settings already live. A snapshot id is
          # scoped to ONE Hetzner project, which is why it cannot be a default
          # in code and why client prod needs its own bake before release.yml
          # gets a line like this.
          #
          # Rebake with `npm run golden:bake -- --location hel1` and update the
          # value. An id that no longer resolves is not an outage: the adapter
          # warns and falls back to stock Ubuntu.
          #
          # Inert while the policy above is byok-required, because a snapshot
          # cannot cross into an org's own project. It goes live for subscribed
          # orgs under plans/SUBSCRIPTION-COMPUTE.md.
          BLITZ_DEPLOY_VAR_HETZNER_SERVER_IMAGES: '*=426576280'
          # The box image canary boots, served as an R2 archive from canary's
          # own account (mode B in docs/BOX-IMAGE.md). Client prod uses mode A,
          # a GHCR digest pushed by release.yml on a `v*` tag.
          #
          # The split exists because `write:packages` lives only inside
          # release.yml, and that workflow also deploys client prod — so a tag
          # is the wrong instrument for refreshing a canary image. Canary
          # rebakes into its own bucket instead and reaches nothing of the
          # customer's.
          #
          # None of the three is a secret. The VM bootstrap fetches the archive
          # with no credential, so the URL is public by design; keeping the pin
          # in this file makes it reviewable, which a value inside
          # CANARY_WRANGLER_TOML is not. Each becomes `wrangler deploy --var`,
          # overriding that one key and leaving the rest of the stored config
          # alone.
          #
          # Rebake with the procedure in docs/BOX-IMAGE.md and update all three
          # together: the digest is of the archive the tag names.
          BLITZ_DEPLOY_VAR_BOX_IMAGE_REF: https://blitz-control-plane.minjunesv0.workers.dev/box-image/manifest.json
          BLITZ_DEPLOY_VAR_BOX_IMAGE_TAG: blitz-box:473cb0be
          BLITZ_DEPLOY_VAR_BOX_IMAGE_SHA256: c0e85a381efd333a58d88a4aec2794c208b81de9ca88239b6a684504d89b4a96
          # The Lody session surface, half two (plans/LODY-SESSIONS.md §13.3).
          # Half one is BLITZ_LODY_SESSIONS inside the image above, which is
          # already baked on: the daemon has to be listening before a browser
          # dials it, and the reverse order gives every member on canary a rail
          # that cannot list a session.
          #
          # It is set HERE and not in env.defaults because env.defaults is the
          # tracked default for every deployment, including a self-hosted fork
          # that should stay dark. `npm run build -w @blitzos/webapp` runs
          # `node --env-file=env.defaults vite build`, and node's --env-file
          # does NOT overwrite a variable already in the environment — so this
          # line wins over the `false` in that file, for this deploy only.
          #
          # The flag is read at MODULE LOAD (webapp/src/lody/flag.ts), so it is
          # a build-time decision: changing it means a deploy, not a restart.
          VITE_BLITZ_LODY_SESSIONS: "true"
          # The billing service's origin, once it has one. Empty is skipped, so
          # this line changes nothing until the value is set, and setting it
          # then needs no commit. It is an environment secret rather than an
          # environment variable, which costs only the masking of a public URL
          # in the log, and keeps every per-deployment setting in one place.
          BLITZ_DEPLOY_VAR_PAYMENT_URL: ${{ secrets.PAYMENT_URL }}
        run: npm run deploy -w packages/control-plane

      # A green deploy command proves upload, not content. Ask the running
      # deployment which commit it is, and fail when it disagrees.
      - name: Verify the deployment reports this commit
        if: steps.gate.outputs.configured == 'true'
        env:
          ORIGIN: ${{ steps.origin.outputs.url }}
        run: |
          if [ -z "$ORIGIN" ]; then
            echo "::warning::The canary config sets no APP_URL, so this deploy could not be verified. A gate that could not run is not a gate that passed."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            reported="$(curl -fsS "$ORIGIN/version" | jq -r '.commit // empty' || true)"
            [ "$reported" = "$GITHUB_SHA" ] && echo "canary reports $reported" && exit 0
            echo "attempt $attempt: reported '${reported:-none}', expected $GITHUB_SHA"
            [ "$attempt" = "5" ] || sleep 6
          done
          echo "::error::$ORIGIN/version reports '${reported:-none}', not $GITHUB_SHA. The deploy uploaded, but the origin is serving something else."
          exit 1
