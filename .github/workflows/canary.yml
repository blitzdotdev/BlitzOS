name: Deploy canary

# Canary is one shared Worker, and the last deploy wins. Deploying it by hand
# from a laptop means a branch can land there silently, and the next person
# debugs a build that matches no commit. That happened. This workflow makes
# "canary always equals main" a property of the machine rather than of
# somebody's discipline.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two canary deploys race. Queue instead of cancelling: a cancelled
# deploy can leave migrations applied with the old Worker still serving.
concurrency:
  group: canary-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Check canary deploy configuration
    runs-on: ubuntu-latest
    environment: canary
    outputs:
      configured: ${{ steps.gate.outputs.configured }}
    steps:
      # A fork, or this repository before the secrets exist, skips with a
      # notice instead of failing. Same shape as release.yml's gate.
      - name: Check for deploy configuration
        id: gate
        env:
          CANARY_WRANGLER_TOML: ${{ secrets.CANARY_WRANGLER_TOML }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CANARY_WRANGLER_TOML" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Canary deploy skipped: set the CANARY_WRANGLER_TOML and CLOUDFLARE_API_TOKEN secrets on the 'canary' environment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: Plan and publish the canary box image
    needs: gate
    runs-on: ubuntu-latest
    environment: canary
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
      tag: ${{ steps.pin.outputs.tag }}
      sha256: ${{ steps.pin.outputs.sha256 }}
      release_id: ${{ steps.pin.outputs.release_id }}
      built: ${{ steps.pin.outputs.built }}
    # The push trigger is already main-only, but workflow_dispatch lets a person
    # pick any ref in the Actions UI. Without this, the one failure mode this
    # workflow exists to remove — a branch deployed to the shared canary Worker —
    # is still reachable by hand. An unconfigured fork stops here after the
    # gate's notice.
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.configured == 'true'
    steps:
      # A depth-one checkout is enough: the release key reads the four image
      # inputs' Git object ids directly from HEAD and never needs a merge base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci

      # The publisher always passes this config to wrangler, and both it and the
      # planner need the canary account's bucket and APP_URL before deployment.
      # The secret must be comment-free because the deploy config patcher rejects
      # comments. It does not have to be up to date: the later deploy fills in any
      # key wrangler.toml.example has gained and generates
      # assets.run_worker_first from core's route registrations. Only
      # account-specific identifiers (account_id, database_id, zone ids,
      # APP_URL) have to be set here.
      - name: Write the canary wrangler.toml
        env:
          CANARY_WRANGLER_TOML: ${{ secrets.CANARY_WRANGLER_TOML }}
        run: printf '%s\n' "$CANARY_WRANGLER_TOML" > packages/control-plane/wrangler.toml

      - name: Read the deployment origin
        id: origin
        run: |
          url="$(node -e 'const fs=require("node:fs");import("smol-toml").then(({parse})=>{const v=parse(fs.readFileSync("packages/control-plane/wrangler.toml","utf8")).vars||{};process.stdout.write(v.APP_URL||"")})')"
          if [ -z "$url" ]; then
            echo "::error::CANARY_WRANGLER_TOML must set vars.APP_URL so the box-image release can be planned and published."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # This is a gate now, not an advisory. A valid matching manifest reuses
      # its immutable pin; only a 404 means build. Invalid content, a wrong tag,
      # another HTTP status, or a network failure stops before Worker deployment.
      - name: Plan the box-image release
        id: plan
        env:
          APP_URL: ${{ steps.origin.outputs.url }}
        run: |
          node packages/control-plane/scripts/plan-box-image.mjs --url "$APP_URL" --json plan.json
          published="$(jq -r '.published' plan.json)"
          if [ "$published" != "true" ] && [ "$published" != "false" ]; then
            echo "::error::The box-image plan did not report whether the release is published."
            exit 1
          fi
          {
            printf 'published=%s\n' "$published"
            printf 'tag=%s\n' "$(jq -r '.imageTag' plan.json)"
            printf 'prefix=%s\n' "$(jq -r '.prefix' plan.json)"
          } >> "$GITHUB_OUTPUT"

      # env.defaults tracks Lody off for self-hosters. Canary turns it on with a
      # validated Docker build arg, replacing the manual edit that once let a
      # clean rebake silently ship Lody off. The repository root is the build
      # context because the Dockerfile also copies the broker and schema fixtures.
      - name: Build the box image
        if: steps.plan.outputs.published == 'false'
        env:
          IMAGE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          payload_version="$(node packages/control-plane/scripts/plan-box-payload.mjs --print-version)"
          docker build --platform linux/amd64 \
            --build-arg BLITZ_LODY_SESSIONS=1 \
            --build-arg "BLITZ_PAYLOAD_VERSION=$payload_version" \
            -f packages/box/Dockerfile -t "$IMAGE_TAG" .

      - name: Boot-smoke the Lody-enabled image
        if: steps.plan.outputs.published == 'false'
        env:
          IMAGE: ${{ steps.plan.outputs.tag }}
          LODY_BOOT_ONLY: "1"
        run: packages/box/test/smoke.sh

      # Each content-derived release gets a versioned R2 prefix, so old boxes
      # retain the exact bytes named by their pin. The publisher uploads every
      # part before manifest.json; a failed upload never activates half a release.
      - name: Publish the box-image release
        if: steps.plan.outputs.published == 'false'
        env:
          APP_URL: ${{ steps.origin.outputs.url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMAGE_TAG: ${{ steps.plan.outputs.tag }}
          PREFIX: ${{ steps.plan.outputs.prefix }}
        run: node packages/control-plane/scripts/publish-box-image.mjs --image "$IMAGE_TAG" --prefix "$PREFIX" --app-url "$APP_URL" --json publish.json

      - name: Expose the box-image pin
        id: pin
        env:
          PUBLISHED: ${{ steps.plan.outputs.published }}
        run: |
          release_id="$(jq -r '.releaseId' plan.json)"
          expected_ref="$(jq -r '.ref' plan.json)"
          expected_tag="$(jq -r '.imageTag' plan.json)"
          expected_prefix="$(jq -r '.prefix' plan.json)"
          if [ "$PUBLISHED" = "true" ]; then
            ref="$expected_ref"
            tag="$expected_tag"
            sha256="$(jq -r '.sha256' plan.json)"
            built=false
          else
            ref="$(jq -r '.ref' publish.json)"
            tag="$(jq -r '.tag' publish.json)"
            sha256="$(jq -r '.sha256' publish.json)"
            prefix="$(jq -r '.prefix' publish.json)"
            if [ "$ref" != "$expected_ref" ] || [ "$tag" != "$expected_tag" ] || [ "$prefix" != "$expected_prefix" ]; then
              echo "::error::Published box-image metadata does not match the planned release."
              exit 1
            fi
            built=true
          fi
          if [ -z "$release_id" ] || [ "$release_id" = "null" ] || [ -z "$ref" ] || [ "$ref" = "null" ] || [ -z "$tag" ] || [ "$tag" = "null" ] || [[ ! "$sha256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::The box-image release did not produce a complete pin."
            exit 1
          fi
          {
            printf 'ref=%s\n' "$ref"
            printf 'tag=%s\n' "$tag"
            printf 'sha256=%s\n' "$sha256"
            printf 'release_id=%s\n' "$release_id"
            printf 'built=%s\n' "$built"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy canary from main
    needs: image
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci

      # wrangler's config patcher rejects a TOML that holds comments, so this
      # secret must be comment-free — the deploy writes to it on every run.
      # It does not have to be up to date: the deploy fills in any key
      # wrangler.toml.example has gained, and generates assets.run_worker_first
      # from core's route registrations. Only account-specific identifiers
      # (account_id, database_id, zone ids, APP_URL) have to be set here.
      - name: Write the canary wrangler.toml
        env:
          CANARY_WRANGLER_TOML: ${{ secrets.CANARY_WRANGLER_TOML }}
        run: printf '%s\n' "$CANARY_WRANGLER_TOML" > packages/control-plane/wrangler.toml

      - name: Read the deployment origin
        id: origin
        run: |
          url="$(node -e 'const fs=require("node:fs");import("smol-toml").then(({parse})=>{const v=parse(fs.readFileSync("packages/control-plane/wrangler.toml","utf8")).vars||{};process.stdout.write(v.APP_URL||"")})')"
          if [ -z "$url" ]; then
            echo "::error::CANARY_WRANGLER_TOML must set vars.APP_URL so the deployment can be verified."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy
        # Both hosted deployments require every org to bring its own cloud
        # credential. A self-hoster runs `npm run deploy` without this and
        # keeps the example default, deployment-fallback.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BLITZ_DEPLOY_VAR_CLOUD_WORKSPACE_CREDENTIAL_POLICY: byok-required
          # The golden Hetzner snapshot this deployment boots. It removes the
          # apt install, the box-image download and the sshd move from first
          # boot: 130.6 s to 45.3 s, measured 2026-08-27.
          #
          # `*` is every location, not a shortcut. A Hetzner snapshot carries an
          # architecture and no location at all, so one x86 image boots every
          # x86 type in the project. Measured 2026-08-28: cx23@hel1 reaches its
          # relocated sshd in 41.3 s and cpx21@hil in 40.1 s, from this image.
          # An arm type would not match and would fall back to stock Ubuntu with
          # a warning; the catalog offers none today.
          #
          # It is hardcoded here rather than kept in a secret because it is not
          # one: it is a plain [vars] entry, and this is where the other
          # per-deployment non-secret settings already live. A snapshot id is
          # scoped to ONE Hetzner project, which is why it cannot be a default
          # in code and why client prod needs its own bake before release.yml
          # gets a line like this.
          #
          # Rebake with `npm run golden:bake -- --location hel1` and update the
          # value. An id that no longer resolves is not an outage: the adapter
          # warns and falls back to stock Ubuntu.
          #
          # Inert while the policy above is byok-required, because a snapshot
          # cannot cross into an org's own project. It goes live for subscribed
          # orgs under plans/SUBSCRIPTION-COMPUTE.md.
          BLITZ_DEPLOY_VAR_HETZNER_SERVER_IMAGES: '*=426576280'
          # The box image canary boots, served as an R2 archive from canary's
          # own account (mode B in docs/BOX-IMAGE.md). Client prod uses mode A,
          # a GHCR digest pushed by release.yml on a `v*` tag.
          #
          # The split exists because `write:packages` lives only inside
          # release.yml, and that workflow also deploys client prod — so a tag
          # is the wrong instrument for refreshing a canary image. The image
          # job instead publishes into canary's bucket and reaches nothing of
          # the customer's.
          #
          # None of the three is a secret. The VM bootstrap fetches the archive
          # with no credential, so the URL is public by design. The exact pin is
          # computed from the merged tree and a validated versioned manifest,
          # then passed as job outputs; these deploy vars override only their
          # three stored-config keys.
          #
          # The versioned box-image/<releaseId> layout keeps old pins valid, and
          # the digest is always taken from the manifest that the tag names.
          BLITZ_DEPLOY_VAR_BOX_IMAGE_REF: ${{ needs.image.outputs.ref }}
          BLITZ_DEPLOY_VAR_BOX_IMAGE_TAG: ${{ needs.image.outputs.tag }}
          BLITZ_DEPLOY_VAR_BOX_IMAGE_SHA256: ${{ needs.image.outputs.sha256 }}
          # The Lody session surface, half two (plans/LODY-SESSIONS.md §13.3).
          # Half one is baked into new canary archives by the image job's
          # BLITZ_LODY_SESSIONS=1 build arg: the daemon has to be listening
          # before a browser dials it, and the reverse order gives every member
          # on canary a rail that cannot list a session.
          #
          # It is set HERE and not in env.defaults because env.defaults is the
          # tracked default for every deployment, including a self-hosted fork
          # that should stay dark. `npm run build -w @blitzos/webapp` runs
          # `node --env-file=env.defaults vite build`, and node's --env-file
          # does NOT overwrite a variable already in the environment — so this
          # line wins over the `false` in that file, for this deploy only.
          #
          # The flag is read at MODULE LOAD (webapp/src/lody/flag.ts), so it is
          # a build-time decision: changing it means a deploy, not a restart.
          VITE_BLITZ_LODY_SESSIONS: "true"
          # The billing service's origin, once it has one. Empty is skipped, so
          # this line changes nothing until the value is set, and setting it
          # then needs no commit. It is an environment secret rather than an
          # environment variable, which costs only the masking of a public URL
          # in the log, and keeps every per-deployment setting in one place.
          BLITZ_DEPLOY_VAR_PAYMENT_URL: ${{ secrets.PAYMENT_URL }}
        run: npm run deploy -w packages/control-plane

      # A green deploy command proves upload, not content. Ask the running
      # deployment which commit and computed image tag it serves, and fail when
      # either disagrees.
      - name: Verify the deployment reports this commit and box image
        env:
          EXPECTED_BOX_IMAGE_TAG: ${{ needs.image.outputs.tag }}
          ORIGIN: ${{ steps.origin.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5; do
            version="$(curl -fsS "$ORIGIN/version" || true)"
            reported_commit="$(printf '%s' "$version" | jq -r '.commit // empty' 2>/dev/null || true)"
            reported_tag="$(printf '%s' "$version" | jq -r '.boxImageTag // empty' 2>/dev/null || true)"
            if [ "$reported_commit" = "$GITHUB_SHA" ] && [ "$reported_tag" = "$EXPECTED_BOX_IMAGE_TAG" ]; then
              echo "canary reports commit $reported_commit and box image $reported_tag"
              exit 0
            fi
            echo "attempt $attempt: reported commit '${reported_commit:-none}' and box image '${reported_tag:-none}'; expected $GITHUB_SHA and $EXPECTED_BOX_IMAGE_TAG"
            [ "$attempt" = "5" ] || sleep 6
          done
          echo "::error::$ORIGIN/version reports commit '${reported_commit:-none}' and box image '${reported_tag:-none}', not $GITHUB_SHA and $EXPECTED_BOX_IMAGE_TAG. The deploy uploaded, but the origin is serving something else."
          exit 1
