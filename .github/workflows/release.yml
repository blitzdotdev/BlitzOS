name: Release images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    outputs:
      box-digest: ${{ steps.box.outputs.digest }}
      broker-digest: ${{ steps.broker.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push box
        id: box
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/box/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: |
            ghcr.io/blitzdotdev/blitz-box:${{ github.ref_name }}
            ghcr.io/blitzdotdev/blitz-box:latest

      - name: Build and push broker
        id: broker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/broker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: |
            ghcr.io/blitzdotdev/blitz-broker:${{ github.ref_name }}
            ghcr.io/blitzdotdev/blitz-broker:latest

  release-notes:
    name: Add image digests to GitHub Release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BOX_DIGEST: ${{ needs.images.outputs.box-digest }}
      BROKER_DIGEST: ${{ needs.images.outputs.broker-digest }}
    steps:
      - name: Create or update release notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi

          existing_body="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          {
            printf '%s\n' "$existing_body"
            printf '\n## Container image digests\n\n'
            printf -- '- `ghcr.io/blitzdotdev/blitz-box:%s` — `%s`\n' "$tag" "$BOX_DIGEST"
            printf -- '- `ghcr.io/blitzdotdev/blitz-broker:%s` — `%s`\n' "$tag" "$BROKER_DIGEST"
          } >"$RUNNER_TEMP/release-notes.md"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md"
